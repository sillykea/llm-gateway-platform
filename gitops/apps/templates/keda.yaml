{{- if .Values.inference.enabled }}
# Scales the inference pool from zero on gateway demand and by queue depth
# once it is up. llm-operator creates one ScaledObject per model.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    # After monitoring (-2), whose Prometheus KEDA queries; before the operator.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: {{ .Values.charts.keda }}
    helm:
      valuesObject:
        resources:
          operator:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          metricServer:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
  {{- include "platform-apps.destination" . | nindent 2 }}
    namespace: keda
  {{- include "platform-apps.syncPolicy" . | nindent 2 }}
{{- end }}
