apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.charts.externalSecrets }}
    helm:
      valuesObject:
        installCRDs: true
        # Service account name must match the Pod Identity association in
        # terraform/modules/secrets.
        serviceAccount:
          name: external-secrets
  {{- include "platform-apps.destination" . | nindent 2 }}
    namespace: external-secrets
  {{- include "platform-apps.syncPolicy" . | nindent 2 }}
