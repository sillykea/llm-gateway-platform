apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: charts/llm-gateway
    helm:
      valueFiles:
        - values-{{ .Values.environment }}.yaml
      valuesObject:
        image:
          tag: {{ .Values.gateway.imageTag | quote }}
        redisAddress: {{ .Values.gateway.redisAddress | quote }}
        externalSecret:
          remoteKey: {{ .Values.gateway.secretName | quote }}
          redisRemoteKey: {{ .Values.gateway.redisSecretName | quote }}
          syncRemoteKey: {{ .Values.console.syncSecretName | quote }}
        keySource:
          url: {{ include "platform-apps.consoleKeysUrl" . | quote }}
          consoleNamespace: {{ .Values.console.namespace }}
        # With GPU inference on, llm-operator adds a route per model and the
        # gateway reads the merged config it writes.
        operatorConfig:
          enabled: {{ .Values.inference.enabled }}
          inferenceNamespace: {{ .Values.inference.namespace }}
  {{- include "platform-apps.destination" . | nindent 2 }}
    namespace: {{ .Values.gateway.namespace }}
  {{- include "platform-apps.syncPolicy" . | nindent 2 }}
