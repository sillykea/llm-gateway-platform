apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: {{ .Values.charts.awsLoadBalancerController }}
    helm:
      valuesObject:
        clusterName: {{ .Values.aws.clusterName | quote }}
        region: {{ .Values.aws.region | quote }}
        vpcId: {{ .Values.aws.vpcId | quote }}
        replicaCount: 2
        # Matches the Pod Identity association in terraform/modules/cluster.
        serviceAccount:
          name: aws-load-balancer-controller
  {{- include "platform-apps.destination" . | nindent 2 }}
    namespace: kube-system
  {{- include "platform-apps.syncPolicy" . | nindent 2 }}
