{{- if not .Values.nodeRoleName }}
{{- fail "nodeRoleName is required: set enable_gpu_inference in Terraform first" }}
{{- end }}
# GPU nodes on demand. With every model at zero replicas, Karpenter removes
# the empty nodes after a minute and nothing bills overnight.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  template:
    metadata:
      labels:
        workload: gpu-inference
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: {{ .Values.nodePool.instanceFamilies | toJson }}
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: In
          values: ["1"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ .Values.nodePool.capacityTypes | toJson }}
      # Only pods that ask for a GPU land here.
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 60s
  limits:
    nvidia.com/gpu: {{ .Values.nodePool.gpuLimit | quote }}
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Karpenter picks the NVIDIA variant of AL2023 for GPU instance types,
  # with the driver and the device plugin's prerequisites installed.
  amiSelectorTerms:
    - alias: al2023@latest
  role: {{ .Values.nodeRoleName | quote }}
  subnetSelectorTerms:
    {{- range .Values.subnetIds }}
    - id: {{ . | quote }}
    {{- end }}
  securityGroupSelectorTerms:
    - id: {{ .Values.nodeSecurityGroupId | quote }}
  # The vLLM image is about 10 GB and a 7B model's weights 15 GB.
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 150Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  # IMDSv2 only, and pods can't reach the node's role through it.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  tags:
    cluster: {{ .Values.clusterName | quote }}
