{{- range $k := list "sessionRemoteKey" "syncRemoteKey" "usersRemoteKey" }}
{{- if not (index $.Values.externalSecret $k) }}
{{- fail (printf "externalSecret.%s is required" $k) }}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ include "console.secretName" . }}
    creationPolicy: Owner
  # Each Secrets Manager secret is a JSON object; every key becomes a key of
  # the Kubernetes Secret.
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.sessionRemoteKey }}
    - extract:
        key: {{ .Values.externalSecret.syncRemoteKey }}
    - extract:
        key: {{ .Values.externalSecret.usersRemoteKey }}
