apiVersion: v1
kind: Service
metadata:
  name: {{ include "console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "console.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    # Key sync for gateways only; the NetworkPolicy keeps everyone else out.
    - name: internal
      port: 8091
      targetPort: internal
      protocol: TCP
