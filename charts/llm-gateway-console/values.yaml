# The console keeps keys and its audit log in files on one volume, so it runs
# as a single-replica StatefulSet (docs/adr/0007-console-deployment.md).
# Gateways keep serving with the keys they last fetched while it restarts.

image:
  repository: ghcr.io/sillykea/llm-gateway-console
  # Set per environment to an immutable commit SHA tag, never "latest".
  tag: ""
  pullPolicy: IfNotPresent

# Prometheus that scrapes the gateways (kube-prometheus-stack in "monitoring").
prometheusUrl: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090

# Namespace of the gateways allowed to call the internal key endpoint.
gatewayNamespace: llm-gateway

# Secrets come from AWS Secrets Manager through External Secrets Operator:
#   sessionRemoteKey  CONSOLE_SESSION_SECRET   (generated by Terraform)
#   syncRemoteKey     CONSOLE_SYNC_TOKEN       (generated by Terraform, shared with the gateway)
#   usersRemoteKey    users.json               (written by hand, docs/runbook.md)
externalSecret:
  storeName: aws-secrets-manager
  sessionRemoteKey: ""
  syncRemoteKey: ""
  usersRemoteKey: ""
  refreshInterval: 1h

storage:
  size: 1Gi
  storageClass: gp3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Session cookies are Secure, so the console must be reached over HTTPS or on
# http://localhost (kubectl port-forward). The ingress therefore needs a
# certificate.
ingress:
  enabled: false
  scheme: internal
  host: ""
  certificateArn: ""

networkPolicy:
  enabled: true
  # VPC CIDR, so the ALB (which targets pod IPs) can reach the UI.
  vpcCidr: 10.0.0.0/8
