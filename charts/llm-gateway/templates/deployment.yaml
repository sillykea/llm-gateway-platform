{{- if not .Values.image.tag }}
{{- fail "image.tag is required: use an immutable commit SHA, not latest" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "llm-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llm-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the config changes.
        checksum/config: {{ include "llm-gateway.config" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "llm-gateway.fullname" . }}
      automountServiceAccountToken: false
      # Longer than the gateway's 30s drain, so Kubernetes never kills it mid-request.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "llm-gateway.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "llm-gateway.selectorLabels" . | nindent 14 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/gateway/gateway.json"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-gateway.secretName" . }}
                  key: GATEWAY_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-gateway.secretName" . }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-gateway.secretName" . }}
                  key: REDIS_PASSWORD
                  optional: true
            {{- if .Values.keySource.url }}
            - name: CONSOLE_SYNC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-gateway.secretName" . }}
                  key: CONSOLE_SYNC_TOKEN
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Let the load balancer deregister the pod before shutdown starts.
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            {{- if .Values.operatorConfig.enabled }}
            # Written by llm-operator, which also rolls this Deployment
            # when it changes.
            name: {{ include "llm-gateway.fullname" . }}-config
            {{- else }}
            name: {{ include "llm-gateway.fullname" . }}
            {{- end }}
