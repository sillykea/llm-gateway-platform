apiVersion: v1
kind: ConfigMap
metadata:
  # With operatorConfig on, this is the base llm-operator merges routes into.
  name: {{ include "llm-gateway.fullname" . }}{{ if .Values.operatorConfig.enabled }}-base{{ end }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
data:
  gateway.json: |
    {{- include "llm-gateway.config" . | nindent 4 }}
