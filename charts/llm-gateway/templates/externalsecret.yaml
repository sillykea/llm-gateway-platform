{{- if .Values.externalSecret.enabled }}
{{- if and .Values.keySource.url (not .Values.externalSecret.syncRemoteKey) }}
{{- fail "externalSecret.syncRemoteKey is required when keySource.url is set" }}
{{- end }}
{{- if not .Values.externalSecret.remoteKey }}
{{- fail "externalSecret.remoteKey is required when externalSecret.enabled" }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ include "llm-gateway.secretName" . }}
    creationPolicy: Owner
  # The Secrets Manager secret holds a JSON object; every key becomes a key
  # of the Kubernetes Secret (GATEWAY_API_KEY, OPENAI_API_KEY).
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey }}
    {{- with .Values.externalSecret.redisRemoteKey }}
    # Adds REDIS_PASSWORD from the secret Terraform created for the cache.
    - extract:
        key: {{ . }}
    {{- end }}
    {{- with .Values.externalSecret.syncRemoteKey }}
    # Adds CONSOLE_SYNC_TOKEN, so the gateway can pull keys from the console.
    - extract:
        key: {{ . }}
    {{- end }}
{{- end }}
