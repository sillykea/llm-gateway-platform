replicaCount: 3

autoscaling:
  minReplicas: 3
  maxReplicas: 12

podDisruptionBudget:
  minAvailable: 2

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    memory: 512Mi

ingress:
  enabled: true
  scheme: internal

ollama:
  resources:
    requests:
      cpu: "2"
      memory: 6Gi
    limits:
      memory: 10Gi
